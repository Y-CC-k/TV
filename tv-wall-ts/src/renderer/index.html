<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>電視牆 ＋ 積點排行</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="books.css" />
  </head>
  <body class="page-tv">

    <!-- 公告機 IP 顯示（右上角，供用戶端輸入） -->
    <div id="serverIpBox" class="server-ip-box">
      <span class="server-ip-label">🖥 公告機 IP：</span>
      <span id="serverIp" class="server-ip-value">--</span>
    </div>

    <!-- ===== 分頁列（分頁一：電視牆固定；其餘卡片分頁由 cardTabs.js 模版自動產生） ===== -->
    <nav id="tabBar" class="tabbar">
      <button type="button" id="tabTv" class="tab active">
        <span class="tab-ico">📺</span><span id="tabNameTv">精彩槺榔</span>
      </button>
    </nav>

    <!-- ===== 分頁一：電視牆（原本的雙區播放） ===== -->
    <div id="tvPage" class="page">
      <div id="root" class="landscape">
        <section id="videoPane" class="pane">
          <video id="video" autoplay playsinline></video>
          <div id="videoMsg" class="msg hidden"></div>
        </section>
        <section id="imagePane" class="pane">
          <img id="image" alt="" />
          <div id="imageCaption" class="image-caption"></div>
          <div id="imageMsg" class="msg hidden"></div>
        </section>
        <section id="imagePane2" class="pane">
          <img id="image2" alt="" />
          <div id="imageCaption2" class="image-caption"></div>
        </section>
        <section id="imagePane3" class="pane">
          <img id="image3" alt="" />
          <div id="imageCaption3" class="image-caption"></div>
        </section>
        <section id="imagePane4" class="pane">
          <img id="image4" alt="" />
          <div id="imageCaption4" class="image-caption"></div>
        </section>
      </div>
    </div>

    <!-- 分頁二以後的卡片分頁（好書介紹／校園風雲／衛教宣導／輔導室公告／校園榮譽榜…）
         全部由 cardTabTemplate.js + cardTabs.js 模版自動產生，此處不需任何 HTML -->

    <script src="cardTabTemplate.js"></script>
    <script src="cardTabs.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
