<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>電視牆用戶端上傳測試（純 HTML 版）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
      background: #f3f5f9; color: #2d3748; line-height: 1.6;
    }
    .container { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { margin: 0 0 8px 0; font-size: 22px; color: #1a73e8; }
    .subtitle { margin: 0; font-size: 14px; color: #718096; }
    .card {
      background: #fff; border-radius: 10px; padding: 20px;
      margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .card h2 { margin: 0 0 16px 0; font-size: 15px; color: #4a5568;
      border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
    .row { margin: 12px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    label { font-size: 14px; width: 110px; color: #4a5568; }
    input[type="text"] { flex: 1; min-width: 150px; padding: 8px 12px;
      border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    input[type="text"]:focus { outline: none; border-color: #1a73e8; }
    .btn-primary {
      background: #1a73e8; color: #fff; border: none; padding: 8px 18px;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) { background: #1557b0; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #f1f3f5; color: #4a5568; border: 1px solid #cbd5e0;
      padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn-secondary:hover { background: #e2e8f0; border-color: #94a3b8; }
    .radio-inline { display: inline-flex; align-items: center; gap: 6px;
      margin-right: 14px; font-size: 14px; color: #4a5568; cursor: pointer; }
    .status {
      font-size: 13px; margin-left: 10px; padding: 2px 8px; border-radius: 12px;
      background: #fed7d7; color: #c53030;
    }
    .status.online { background: #c6f6d5; color: #276749; }
    .file-info { font-size: 13px; color: #718096; margin-left: 10px; }
    progress { flex: 1; height: 10px; border-radius: 5px; overflow: hidden; border: none; }
    progress::-webkit-progress-bar { background: #e2e8f0; border-radius: 5px; }
    progress::-webkit-progress-value { background: #1a73e8; border-radius: 5px; }
    .msg { font-size: 13px; margin-top: 6px; min-height: 18px; }
    .msg.success { color: #276749; }
    .msg.error { color: #c53030; }
    .file-list { border: 1px solid #e2e8f0; border-radius: 8px; max-height: 240px;
      overflow-y: auto; background: #fafbfc; }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid #e2e8f0; font-size: 14px;
    }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: #edf2f7; }
    .file-name { color: #2d3748; font-weight: 500; }
    .file-size { color: #718096; font-size: 13px; margin-left: 10px; }
    .file-actions button { background: #e53e3e; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .file-actions button:hover { background: #c53030; }
    .count { font-size: 13px; color: #718096; margin-left: auto; }
    footer { text-align: center; font-size: 12px; color: #a0aec0; margin-top: 24px; }
    .hint { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 6px;
      padding: 10px 14px; font-size: 13px; color: #0050b3; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📤 電視牆用戶端上傳測試</h1>
      <p class="subtitle">純 HTML 版本，直接用瀏覽器開啟即可測試上傳到公告機</p>
    </header>

    <div class="hint">
      💡 使用步驟：<br/>
      1. 先在公告機執行 <code>npm start</code>（需設定 <code>serverMode: true</code>）<br/>
      2. 在此頁面輸入公告機 IP 與 Port（預設 8123）<br/>
      3. 點擊「連線公告機」，確認狀態為「已連線」<br/>
      4. 選擇照片或影片，點擊「上傳到公告機」<br/>
      5. 上傳成功後，公告機電視牆會自動加入播放
    </div>

    <!-- 連線設定 -->
    <section class="card">
      <h2>連線設定</h2>
      <div class="row">
        <label for="testServerIp">公告機 IP:</label>
        <input type="text" id="testServerIp" placeholder="例如 192.168.1.100" />
      </div>
      <div class="row">
        <label for="testServerPort">Port:</label>
        <input type="text" id="testServerPort" value="8123" />
      </div>
      <div class="row">
        <button id="testBtnConnect" class="btn-primary">連線公告機</button>
        <span id="testConnStatus" class="status">未連線</span>
      </div>
    </section>

    <!-- 上傳區 -->
    <section class="card">
      <h2>上傳檔案</h2>
      <div class="row type-row">
        <label>類型:</label>
        <label class="radio-inline"><input type="radio" name="testFileType" value="image" checked /> 照片</label>
        <label class="radio-inline"><input type="radio" name="testFileType" value="video" /> 影片</label>
      </div>
      <div class="row">
        <button id="testBtnSelectFile" class="btn-secondary">選擇檔案</button>
        <span id="testSelectedFile" class="file-info">未選擇檔案</span>
        <input type="file" id="testFileInput" style="display: none;" />
      </div>
      <div class="row">
        <button id="testBtnUpload" class="btn-primary" disabled>上傳到公告機</button>
      </div>
      <div class="row progress-row">
        <progress id="testUploadProgress" max="100" value="0"></progress>
        <span id="testProgressText">0%</span>
      </div>
      <div class="row">
        <span id="testUploadMsg" class="msg"></span>
      </div>
    </section>

    <!-- 檔案清單 -->
    <section class="card">
      <h2>公告機檔案清單</h2>
      <div class="row">
        <button id="testBtnRefresh" class="btn-secondary">重新整理</button>
        <span id="testListCount" class="count">0 個檔案</span>
      </div>
      <div id="testFileList" class="file-list"></div>
    </section>

    <footer>© 2026 電視牆公告系統 &#8226; 用戶端上傳測試工具</footer>
  </div>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);

      let baseUrl = "";
      let selectedFile = null;

      const testServerIp = $("testServerIp");
      const testServerPort = $("testServerPort");
      const testBtnConnect = $("testBtnConnect");
      const testConnStatus = $("testConnStatus");
      const testBtnSelectFile = $("testBtnSelectFile");
      const testFileInput = $("testFileInput");
      const testSelectedFile = $("testSelectedFile");
      const testBtnUpload = $("testBtnUpload");
      const testUploadProgress = $("testUploadProgress");
      const testProgressText = $("testProgressText");
      const testUploadMsg = $("testUploadMsg");
      const testBtnRefresh = $("testBtnRefresh");
      const testFileList = $("testFileList");
      const testListCount = $("testListCount");

      function setConnStatus(online, text) {
        testConnStatus.textContent = text;
        testConnStatus.className = "status " + (online ? "online" : "offline");
      }

      async function testConnection() {
        const ip = testServerIp.value.trim();
        const port = testServerPort.value.trim();
        if (!ip) { setConnStatus(false, "請輸入 IP"); return; }
        baseUrl = `http://${ip}:${port}`;
        try {
          const res = await fetch(`${baseUrl}/`, { signal: AbortSignal.timeout(5000) });
          if (res.ok) {
            setConnStatus(true, "已連線");
            testBtnUpload.disabled = false;
            loadFileList();
          } else {
            setConnStatus(false, "伺服器回應異常");
            testBtnUpload.disabled = true;
          }
        } catch (err) {
          setConnStatus(false, "連線失敗");
          testBtnUpload.disabled = true;
          testUploadMsg.textContent = "";
        }
      }

      testBtnConnect.addEventListener("click", testConnection);
      testServerIp.addEventListener("keypress", (e) => { if (e.key === "Enter") testConnection(); });

      testBtnSelectFile.addEventListener("click", () => testFileInput.click());
      testFileInput.addEventListener("change", (e) => {
        const f = testFileInput.files[0];
        if (!f) return;
        selectedFile = f;
        const mb = (f.size / 1024 / 1024).toFixed(2);
        testSelectedFile.textContent = f.name + " (" + mb + " MB)";
        testBtnUpload.disabled = false;
        testUploadMsg.textContent = "";
        testUploadProgress.value = 0;
        testProgressText.textContent = "0%";
      });

      testBtnUpload.addEventListener("click", async () => {
        if (!selectedFile) return;
        const type = document.querySelector('input[name="testFileType"]:checked').value;

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("type", type);

        testUploadMsg.textContent = "上傳中…";
        testUploadMsg.className = "msg";
        testUploadProgress.value = 0;
        testProgressText.textContent = "0%";
        testBtnUpload.disabled = true;

        try {
          const res = await fetch(`${baseUrl}/upload`, {
            method: "POST",
            body: formData,
            signal: AbortSignal.timeout(300000),
          });
          if (!res.ok) {
            const errText = await res.text().catch(() => "");
            throw new Error("上傳失敗 HTTP " + res.status + (errText ? ": " + errText.slice(0,200) : ""));
          }
          const result = await res.json();
          testUploadMsg.textContent = "上傳成功：" + result.name;
          testUploadMsg.className = "msg success";
          testUploadProgress.value = 100;
          testProgressText.textContent = "100%";

          selectedFile = null;
          testFileInput.value = "";
          testSelectedFile.textContent = "未選擇檔案";
          testBtnUpload.disabled = true;

          setTimeout(loadFileList, 1500);
        } catch (err) {
          testUploadMsg.textContent = "上傳失敗：" + err.message;
          testUploadMsg.className = "msg error";
          testBtnUpload.disabled = false;
        }
      });

      async function loadFileList() {
        if (!baseUrl) return;
        try {
          const res = await fetch(`${baseUrl}/files`, { signal: AbortSignal.timeout(5000) });
          if (!res.ok) throw new Error("無法取得清單 HTTP " + res.status);
          const data = await res.json();

          const videos = data.videos || [];
          const images = data.images || [];
          const allFiles = [...videos, ...images];

          testFileList.innerHTML = "";
          testListCount.textContent = allFiles.length + " 個檔案";

          if (allFiles.length === 0) {
            testFileList.innerHTML = '<div style="padding:16px;color:#718096;text-align:center;">無檔案</div>';
            return;
          }

          allFiles.sort((a, b) => {
            if (a.type !== b.type) return a.type === "video" ? -1 : 1;
            return a.name.localeCompare(b.name);
          });

          for (const f of allFiles) {
            const div = document.createElement("div");
            div.className = "file-item";
            const typeLabel = f.type === "video" ? "🎬" : "🖼";
            div.innerHTML = `
              <div>
                <span class="file-name">${typeLabel} ${esc(f.name)}</span>
                <span class="file-size">${(f.size / 1024 / 1024).toFixed(2)} MB</span>
              </div>
              <div class="file-actions">
                <button data-type="${f.type}" data-name="${esc(f.name)}">刪除</button>
              </div>
            `;
            testFileList.appendChild(div);
          }

          testFileList.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const type = btn.getAttribute("data-type");
              const name = btn.getAttribute("data-name");
              if (!confirm(`確定要刪除 ${name} 嗎？`)) return;
              try {
                const delRes = await fetch(`${baseUrl}/files/${type}/${encodeURIComponent(name)}`, {
                  method: "DELETE", signal: AbortSignal.timeout(10000),
                });
                if (!delRes.ok) throw new Error("刪除失敗 HTTP " + delRes.status);
                loadFileList();
              } catch (err) {
                alert("刪除失敗：" + err.message);
              }
            });
          });
        } catch (err) {
          testFileList.innerHTML = `<div style="padding:16px;color:#c53030;text-align:center;">載入失敗：${err.message}</div>`;
        }
      }

      testBtnRefresh.addEventListener("click", loadFileList);

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      setConnStatus(false, "未連線");
      testBtnUpload.disabled = true;
    })();
  </script>
</body>
</html>
